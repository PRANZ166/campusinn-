services:
  - type: web
    name: campus-inn-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm run migrate && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: campus-inn-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: COOKIE_SECRET
        generateValue: true

databases:
  - name: campus-inn-db
    databaseName: campus_inn_db
    user: campus_inn_user
    plan: free
