services:
  - type: web
    name: campus-inn-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm run migrate && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: campus-inn-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: COOKIE_SECRET
        generateValue: true
      - key: ADMIN_OPERATOR_SECRET
        value: CampusInn_Operator_Master_2026!
      - key: ADMIN_BOOTSTRAP_SECRET
        value: CampusInn_Operator_Master_2026!
      - key: FRONTEND_URL
        value: https://campusinn-frontend-tau.vercel.app
      - key: GOOGLE_CALLBACK_URL
        value: https://campus-inn-backend.onrender.com/api/v1/auth/google/callback
      - key: CORS_ORIGIN
        value: https://campusinn-frontend-tau.vercel.app,https://campusinn-frontend-9nxrritaj-pranz.vercel.app,https://campus-inn-backend.onrender.com,http://localhost:3000,http://localhost:5500

databases:
  - name: campus-inn-db
    databaseName: campus_inn_db
    user: campus_inn_user
    plan: free
